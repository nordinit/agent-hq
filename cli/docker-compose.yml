###############################################################################
# Packaged Agent HQ stack. Images are pulled from the registry; the repository
# compose file adds build sections for source checkouts.
###############################################################################

name: agent-hq

volumes:
  agent-hq-postgres-data:
    driver: local
  agent-hq-workspaces:
    driver: local
  agent-hq-contracts:
    driver: local
  agent-hq-uploads:
    driver: local

x-database-url: &database-url
  DATABASE_URL: ${DATABASE_URL:-postgresql://${AGENT_HQ_POSTGRES_USER:-agenthq}:${AGENT_HQ_POSTGRES_PASSWORD:-agent-hq-local}@agent-hq-postgres:5432/${AGENT_HQ_POSTGRES_DB:-agent_hq}}

services:
  agent-hq-postgres:
    image: postgres:17-alpine
    container_name: agent-hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_HQ_POSTGRES_DB:-agent_hq}
      POSTGRES_USER: ${AGENT_HQ_POSTGRES_USER:-agenthq}
      POSTGRES_PASSWORD: ${AGENT_HQ_POSTGRES_PASSWORD:-agent-hq-local}
    volumes:
      - agent-hq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent-hq-migrate:
    image: nordinit/agent-hq-api:latest
    restart: "no"
    environment:
      <<: *database-url
      NODE_ENV: production
      WORKSPACE_PARENT: /app/workspaces
      AGENT_CONTRACT_ROOT: /app/agent-contracts
    volumes:
      - agent-hq-workspaces:/app/workspaces
      - agent-hq-contracts:/app/agent-contracts
    command: ["node", "dist/db/migrate.js", "--install"]
    depends_on:
      agent-hq-postgres:
        condition: service_healthy

  agent-hq-api:
    image: nordinit/agent-hq-api:latest
    container_name: agent-hq-api
    restart: unless-stopped
    ports:
      - "${AGENT_HQ_API_PORT:-3501}:3501"
    environment:
      <<: *database-url
      NODE_ENV: production
      PORT: "3501"
      WORKSPACE_PARENT: /app/workspaces
      AGENT_CONTRACT_ROOT: /app/agent-contracts
      AGENT_HQ_UPLOADS_DIR: /app/uploads
    volumes:
      - agent-hq-workspaces:/app/workspaces
      - agent-hq-contracts:/app/agent-contracts
      - agent-hq-uploads:/app/uploads
    depends_on:
      agent-hq-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3501/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  agent-hq-ui:
    image: nordinit/agent-hq-ui:latest
    container_name: agent-hq-ui
    restart: unless-stopped
    ports:
      - "${AGENT_HQ_UI_PORT:-3500}:3500"
    environment:
      NODE_ENV: production
      PORT: "3500"
      AGENT_HQ_INTERNAL_BASE_URL: http://agent-hq-api:3501
    depends_on:
      agent-hq-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3500"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
