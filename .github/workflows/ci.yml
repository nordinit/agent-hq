name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, test, build
    runs-on: ubuntu-latest

    # 17 to match the version production runs, so CI cannot pass on behaviour a different major
    # changes. Identifier folding, numeric widening in SUM()/AVG() and ON CONFLICT arbitration —
    # the three things that have already bitten this migration — are all version-sensitive.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_hq_ci
        ports:
          - 5432:5432
        # Without a health check the test step starts before the server accepts connections and
        # fails with ECONNREFUSED rather than a real result.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        working-directory: api
        run: npm ci

      - name: Check workflow terminology
        run: node scripts/check-workflow-terminology.mjs

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Test (PostgreSQL 17)
        working-directory: api
        run: npm test
        env:
          AGENT_HQ_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/agent_hq_ci

      - name: Build
        working-directory: api
        run: npm run build

  ui:
    name: UI — verify, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Verify (test + lint)
        working-directory: ui
        run: npm run verify

      - name: Build
        working-directory: ui
        run: npm run build

  cli:
    name: CLI and OpenClaw plugin — test
    runs-on: ubuntu-latest
    # Neither suite needs an install: both run node:test against dependency-free modules.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test CLI
        run: npm run test:cli

      - name: Test OpenClaw capability-tools plugin
        working-directory: plugins/openclaw-capability-tools
        run: npm test

  docker:
    name: Docker image — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: api/Dockerfile
          - image: ui
            dockerfile: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: the image stays in the builder cache and nothing is pushed or loaded.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: agent-hq-${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,scope=ci-${{ matrix.image }},mode=max
