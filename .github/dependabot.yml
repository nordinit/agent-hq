version: 2

# Weekly version updates. Minor and patch bumps are grouped into one PR per package so routine
# updates stay reviewable; majors and security updates still arrive as individual PRs.
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    groups:
      cli-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
