###############################################################################
# Agent HQ local/self-hosted stack. PostgreSQL 17 is the system of record.
#
#   docker compose up --build -d
#   docker compose down                 # data is retained
#   docker compose down -v              # removes DB, workspaces, contracts, and uploads
#
# Set DATABASE_URL to use an external PostgreSQL server. The bundled server is
# still started (but remains private to this Compose network) so the same file
# stays a reliable one-command install.
###############################################################################

name: agent-hq

volumes:
  agent-hq-postgres-data:
    driver: local
  agent-hq-workspaces:
    driver: local
  agent-hq-contracts:
    driver: local
  agent-hq-uploads:
    driver: local

x-database-url: &database-url
  DATABASE_URL: ${DATABASE_URL:-postgresql://${AGENT_HQ_POSTGRES_USER:-agenthq}:${AGENT_HQ_POSTGRES_PASSWORD:-agent-hq-local}@agent-hq-postgres:5432/${AGENT_HQ_POSTGRES_DB:-agent_hq}}

services:
  agent-hq-postgres:
    image: postgres:17-alpine
    container_name: agent-hq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_HQ_POSTGRES_DB:-agent_hq}
      POSTGRES_USER: ${AGENT_HQ_POSTGRES_USER:-agenthq}
      POSTGRES_PASSWORD: ${AGENT_HQ_POSTGRES_PASSWORD:-agent-hq-local}
    volumes:
      - agent-hq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent-hq-migrate:
    image: nordinit/agent-hq-api:latest
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: "no"
    environment:
      <<: *database-url
      NODE_ENV: production
      WORKSPACE_PARENT: /app/workspaces
      AGENT_CONTRACT_ROOT: /app/agent-contracts
    volumes:
      - agent-hq-workspaces:/app/workspaces
      - agent-hq-contracts:/app/agent-contracts
    command: ["node", "dist/db/migrate.js", "--install"]
    depends_on:
      agent-hq-postgres:
        condition: service_healthy

  agent-hq-api:
    image: nordinit/agent-hq-api:latest
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: agent-hq-api
    restart: unless-stopped
    ports:
      - "${AGENT_HQ_BIND_ADDRESS:-127.0.0.1}:${AGENT_HQ_API_PORT:-3501}:3501"
    environment:
      <<: *database-url
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3501"
      WORKSPACE_PARENT: /app/workspaces
      AGENT_CONTRACT_ROOT: /app/agent-contracts
      AGENT_HQ_UPLOADS_DIR: /app/uploads
      # Every /api/v1 request must present this token or an agent MCP key; the UI signs in with it.
      AGENT_HQ_OPERATOR_TOKEN: &operator-token "${AGENT_HQ_OPERATOR_TOKEN:?AGENT_HQ_OPERATOR_TOKEN is required - generate one with openssl rand -hex 32 and put it in the .env file next to this compose file (agent-hq start does this for you)}"
      AGENT_HQ_AUTH_MODE: ${AGENT_HQ_AUTH_MODE:-enforce}
    volumes:
      - agent-hq-workspaces:/app/workspaces
      - agent-hq-contracts:/app/agent-contracts
      - agent-hq-uploads:/app/uploads
    depends_on:
      agent-hq-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3501/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  agent-hq-ui:
    image: nordinit/agent-hq-ui:latest
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3501}
    container_name: agent-hq-ui
    restart: unless-stopped
    ports:
      - "${AGENT_HQ_BIND_ADDRESS:-127.0.0.1}:${AGENT_HQ_UI_PORT:-3500}:3500"
    environment:
      NODE_ENV: production
      PORT: "3500"
      AGENT_HQ_INTERNAL_BASE_URL: http://agent-hq-api:3501
      AGENT_HQ_OPERATOR_TOKEN: *operator-token
    depends_on:
      agent-hq-api:
        condition: service_healthy
    healthcheck:
      # The sign-in page is the one page that answers without a session.
      test: ["CMD", "wget", "-qO-", "http://localhost:3500/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
