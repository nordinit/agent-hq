<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent HQ</title>
  <desc id="desc">Agent HQ, the open-source control plane for AI agents doing real work. A task is routed to a builder agent running Claude Code, passes an evidence gate, is handed to a reviewer agent running Codex, and is done.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e293b"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="640" rx="24" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="80" y="72" width="72" height="72" rx="18" fill="url(#mark)"/>
    <path transform="translate(92 84) scale(2)" d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" fill="#0b1120"/>
    <text x="176" y="131" fill="#f8fafc" font-size="64" font-weight="800" letter-spacing="-1">Agent HQ</text>

    <text x="80" y="210" fill="#e2e8f0" font-size="32" font-weight="600">The open-source control plane for AI agents doing real work.</text>
    <text x="80" y="254" fill="#94a3b8" font-size="23">Route tasks to agents, enforce evidence gates, and move work forward on outcomes.</text>

    <rect x="80" y="300" width="1120" height="216" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="112" y="340" fill="#64748b" font-size="15" font-weight="700" letter-spacing="3">WORKFLOW</text>

    <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
      <line x1="294" y1="424" x2="326" y2="424"/>
      <line x1="514" y1="424" x2="546" y2="424"/>
      <line x1="734" y1="424" x2="766" y2="424"/>
      <line x1="954" y1="424" x2="986" y2="424"/>
    </g>

    <rect x="112" y="360" width="176" height="128" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="132" y="392" fill="#94a3b8" font-size="15" font-weight="700" letter-spacing="2">TASK #128</text>
    <text x="132" y="428" fill="#f8fafc" font-size="23" font-weight="600">Add SSO</text>
    <rect x="132" y="446" width="66" height="26" rx="13" fill="#1e293b"/>
    <text x="165" y="465" fill="#cbd5e1" font-size="15" text-anchor="middle">ready</text>

    <rect x="332" y="360" width="176" height="128" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="352" y="392" fill="#94a3b8" font-size="15" font-weight="700" letter-spacing="2">AGENT</text>
    <text x="352" y="428" fill="#f8fafc" font-size="23" font-weight="600">Builder</text>
    <text x="352" y="462" fill="#94a3b8" font-size="19">Claude Code</text>

    <rect x="552" y="360" width="176" height="128" rx="16" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
    <text x="572" y="392" fill="#fbbf24" font-size="15" font-weight="700" letter-spacing="2">GATE</text>
    <text x="572" y="428" fill="#f8fafc" font-size="23" font-weight="600">Tests pass</text>
    <text x="572" y="462" fill="#fcd34d" font-size="19">PR linked</text>

    <rect x="772" y="360" width="176" height="128" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="792" y="392" fill="#94a3b8" font-size="15" font-weight="700" letter-spacing="2">AGENT</text>
    <text x="792" y="428" fill="#f8fafc" font-size="23" font-weight="600">Reviewer</text>
    <text x="792" y="462" fill="#94a3b8" font-size="19">Codex</text>

    <rect x="992" y="360" width="176" height="128" rx="16" fill="#0b1f17" stroke="#22c55e" stroke-width="2"/>
    <text x="1012" y="392" fill="#4ade80" font-size="15" font-weight="700" letter-spacing="2">OUTCOME</text>
    <text x="1012" y="428" fill="#f8fafc" font-size="23" font-weight="600">Done</text>
    <path d="M1014 452 l7 7 l14 -15" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1044" y="462" fill="#86efac" font-size="19">merged</text>

    <text x="80" y="582" fill="#94a3b8" font-size="22">Claude Code &#183; Codex &#183; Hermes &#183; OpenClaw &#183; Webhooks</text>
    <text x="1200" y="582" fill="#64748b" font-size="20" text-anchor="end">MIT licensed &#183; self-hosted</text>
  </g>
</svg>
